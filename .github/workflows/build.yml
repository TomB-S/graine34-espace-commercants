# Fabrication des exécutables (Windows, macOS, Linux). Lancement à la demande (onglet Actions) ou à la publication
# d'une étiquette de version (v*). Pas de lancement à chaque push. Aucun secret, aucune signature de code.
name: Fabrication des exécutables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Node 24)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --version
      - run: npm ci
      - run: npm test

  executables:
    name: Exécutable ${{ matrix.label }}
    needs: tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, label: linux-x64 }
          - { os: windows-2025, label: windows-x64 }
          - { os: macos-15, label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Version de Node
        run: node --version
      - run: npm ci
      - run: npm run build:exe
      - name: Contrôle de démarrage
        run: node tools/smoke-exe.js
      # Un zip d'artefact fait perdre le droit d'exécution : sous Linux et macOS, le fichier est envoyé dans une archive
      # tar.gz (qui le garde), sans zip par-dessus. Sous Windows, le .exe est envoyé tel quel.
      - name: Préparation du fichier à envoyer
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp build/graine34-espace-commercants.exe "build/graine34-espace-commercants-${LABEL}.exe"
            echo "FILE=build/graine34-espace-commercants-${LABEL}.exe" >> "$GITHUB_ENV"
          else
            COPYFILE_DISABLE=1 tar -czf "build/graine34-espace-commercants-${LABEL}.tar.gz" -C build graine34-espace-commercants
            echo "FILE=build/graine34-espace-commercants-${LABEL}.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.FILE }}
          archive: false
          retention-days: 7
          if-no-files-found: error
